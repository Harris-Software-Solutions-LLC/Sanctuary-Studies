<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1007" viewBox="0 0 1440 1007" role="img" aria-labelledby="title desc"><title id="title">Most Holy Place</title><desc id="desc">Acceptance, law and judgment. Step 5 belongs to the Daily sequence. Steps 13–16 belong to the Yearly sequence. Step 14 has no Aaron counterpart.</desc><rect width="100%" height="100%" fill="#F5F4EF"/><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="240" rx="0" fill="#F5F4EF"/><rect x="40" y="42" width="5" height="42" rx="0" fill="#A1823D"/><text x="62" y="60" font-size="15" font-weight="700" fill="#576763">SANCTUARY STUDIES / THE SANCTUARY WORK</text><text x="60" y="116" font-size="38" font-weight="700" fill="#18312F">Most Holy Place</text><text x="60" y="153" font-size="20" font-weight="400" fill="#576763">Acceptance, law and judgment</text><text x="60" y="194" font-size="15" font-weight="700" fill="#993F38">AARON · EARTHLY SERVICE</text><text x="400" y="194" font-size="15" font-weight="700" fill="#226749">CHRIST · CORRESPONDING WORK</text><text x="1040" y="194" font-size="13" font-weight="400" fill="#576763">SOURCE NUMBERING PRESERVED</text><rect x="48" y="218" width="1344" height="48" rx="8" fill="#18312F"/><text x="68" y="248" font-size="13" font-weight="700" fill="#FFFFFF">STEP / ACTION</text><text x="334" y="248" font-size="13" font-weight="700" fill="#FFFFFF">AARON · FUNCTION</text><text x="752" y="248" font-size="13" font-weight="700" fill="#FFFFFF">CHRIST · CORRESPONDENCE</text><text x="1170" y="248" font-size="13" font-weight="700" fill="#FFFFFF">FURNITURE / FEATURE</text><rect x="48" y="278" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="296" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="316" font-size="17" font-weight="700" fill="#FFFFFF">05</text><text x="68" y="349" font-size="18" font-weight="700" fill="#18312F">Present blood;</text><text x="68" y="374" font-size="18" font-weight="700" fill="#18312F">acceptance</text><text x="334" y="310" font-size="18" font-weight="400" fill="#993F38">Places bull’s blood on the ark/mercy seat</text><text x="334" y="336" font-size="18" font-weight="400" fill="#993F38">and brings incense before God.</text><text x="752" y="310" font-size="18" font-weight="400" fill="#226749">Presents His blood; acceptance by God.</text><text x="1170" y="310" font-size="17" font-weight="400" fill="#18312F">Ark; mercy seat;</text><text x="1170" y="336" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="411" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="429" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="449" font-size="17" font-weight="700" fill="#FFFFFF">13</text><text x="68" y="482" font-size="18" font-weight="700" fill="#18312F">Enter with goat’s blood</text><text x="334" y="443" font-size="18" font-weight="400" fill="#993F38">Carries the congregation’s offering within</text><text x="334" y="469" font-size="18" font-weight="400" fill="#993F38">the veil.</text><text x="752" y="443" font-size="18" font-weight="400" fill="#226749">Enters the Most Holy Place in heaven.</text><text x="1170" y="443" font-size="17" font-weight="400" fill="#18312F">Inner veil; ark; mercy</text><text x="1170" y="469" font-size="17" font-weight="400" fill="#18312F">seat</text><rect x="48" y="531" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="549" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="569" font-size="17" font-weight="700" fill="#FFFFFF">14</text><text x="68" y="602" font-size="18" font-weight="700" fill="#18312F">Show the law and</text><text x="68" y="627" font-size="18" font-weight="700" fill="#18312F">Sabbath</text><text x="334" y="563" font-size="18" font-weight="400" fill="#993F38">No Aaron counterpart is shown.</text><text x="752" y="563" font-size="18" font-weight="400" fill="#226749">Stands before the law, showing the</text><text x="752" y="589" font-size="18" font-weight="400" fill="#226749">Sabbath to believers in 1844.</text><text x="1170" y="563" font-size="17" font-weight="400" fill="#18312F">Ark; tablets of the law</text><rect x="48" y="664" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="682" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="702" font-size="17" font-weight="700" fill="#FFFFFF">15</text><text x="68" y="735" font-size="18" font-weight="700" fill="#18312F">Judgment before God</text><text x="334" y="696" font-size="18" font-weight="400" fill="#993F38">Participates in the yearly service before</text><text x="334" y="722" font-size="18" font-weight="400" fill="#993F38">God.</text><text x="752" y="696" font-size="18" font-weight="400" fill="#226749">Sits with God as Judge; investigative</text><text x="752" y="722" font-size="18" font-weight="400" fill="#226749">judgment.</text><text x="1170" y="696" font-size="17" font-weight="400" fill="#18312F">Ark/mercy-seat setting;</text><text x="1170" y="722" font-size="17" font-weight="400" fill="#18312F">throne</text><rect x="48" y="784" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="802" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="822" font-size="17" font-weight="700" fill="#FFFFFF">16</text><text x="68" y="855" font-size="18" font-weight="700" fill="#18312F">Sprinkle blood;</text><text x="68" y="880" font-size="18" font-weight="700" fill="#18312F">complete judgment</text><text x="334" y="816" font-size="18" font-weight="400" fill="#993F38">Sprinkles blood on the mercy seat and</text><text x="334" y="842" font-size="18" font-weight="400" fill="#993F38">before the law.</text><text x="752" y="816" font-size="18" font-weight="400" fill="#226749">Pleads His blood; sins removed, people</text><text x="752" y="842" font-size="18" font-weight="400" fill="#226749">sealed, sins blotted from the book.</text><text x="1170" y="816" font-size="17" font-weight="400" fill="#18312F">Mercy seat; law; record</text><text x="1170" y="842" font-size="17" font-weight="400" fill="#18312F">books</text><text x="60" y="945" font-size="17" font-weight="400" fill="#576763">Step 5 belongs to the Daily sequence. Steps 13–16 belong to the Yearly sequence. Step 14 has no Aaron counterpart.</text><text x="60" y="970" font-size="17" font-weight="400" fill="#576763">Source-based study correspondence • The numbering and theological interpretation follow the supplied timelines.</text></g></svg>