<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1753" viewBox="0 0 1440 1753" role="img" aria-labelledby="title desc"><title id="title">Daily timeline</title><desc id="desc">Steps 0–10 · Historical events and continuing ministry. Aaron’s “about 6 a.m.” and “most part of the day” describe the symbolic service-day clock, not historical calendar dates.</desc><rect width="100%" height="100%" fill="#F5F4EF"/><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="240" rx="0" fill="#F5F4EF"/><rect x="40" y="42" width="5" height="42" rx="0" fill="#A1823D"/><text x="62" y="60" font-size="15" font-weight="700" fill="#576763">SANCTUARY STUDIES / THE SANCTUARY WORK</text><text x="60" y="116" font-size="38" font-weight="700" fill="#18312F">Daily timeline</text><text x="60" y="153" font-size="20" font-weight="400" fill="#576763">Steps 0–10 · Historical events and continuing ministry</text><text x="60" y="194" font-size="15" font-weight="700" fill="#993F38">AARON · EARTHLY SERVICE</text><text x="400" y="194" font-size="15" font-weight="700" fill="#226749">CHRIST · CORRESPONDING WORK</text><text x="1040" y="194" font-size="13" font-weight="400" fill="#576763">SOURCE NUMBERING PRESERVED</text><rect x="48" y="218" width="1344" height="48" rx="8" fill="#18312F"/><text x="68" y="248" font-size="13" font-weight="700" fill="#FFFFFF">STEP / DATE OR PERIOD</text><text x="334" y="248" font-size="13" font-weight="700" fill="#FFFFFF">AARON · FUNCTION</text><text x="752" y="248" font-size="13" font-weight="700" fill="#FFFFFF">CHRIST · CORRESPONDENCE</text><text x="1170" y="248" font-size="13" font-weight="700" fill="#FFFFFF">FURNITURE / FEATURE</text><rect x="48" y="278" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="296" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="316" font-size="17" font-weight="700" fill="#FFFFFF">00</text><text x="68" y="349" font-size="18" font-weight="700" fill="#18312F">Beginning of service</text><text x="334" y="310" font-size="18" font-weight="400" fill="#993F38">Comes into the courtyard to begin</text><text x="334" y="336" font-size="18" font-weight="400" fill="#993F38">ministry.</text><text x="752" y="310" font-size="18" font-weight="400" fill="#226749">Jesus is born.</text><text x="1170" y="310" font-size="17" font-weight="400" fill="#18312F">Courtyard gate</text><rect x="48" y="398" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="416" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="436" font-size="17" font-weight="700" fill="#FFFFFF">01</text><text x="68" y="469" font-size="18" font-weight="700" fill="#18312F">AD 27</text><text x="334" y="430" font-size="18" font-weight="400" fill="#993F38">Washes body; puts on common priest’s</text><text x="334" y="456" font-size="18" font-weight="400" fill="#993F38">garments to prepare for service.</text><text x="752" y="430" font-size="18" font-weight="400" fill="#226749">Baptism.</text><text x="1170" y="430" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="518" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="536" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="556" font-size="17" font-weight="700" fill="#FFFFFF">02</text><text x="68" y="589" font-size="18" font-weight="700" fill="#18312F">AD 31 · Crucifixion</text><text x="334" y="550" font-size="18" font-weight="400" fill="#993F38">Offers a bull for himself and his household</text><text x="334" y="576" font-size="18" font-weight="400" fill="#993F38">before serving the people.</text><text x="752" y="550" font-size="18" font-weight="400" fill="#226749">Crucifixion; represented as the bull</text><text x="752" y="576" font-size="18" font-weight="400" fill="#226749">offering for Himself and His co-laborers.</text><text x="1170" y="550" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="638" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="656" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="676" font-size="17" font-weight="700" fill="#FFFFFF">03</text><text x="68" y="709" font-size="18" font-weight="700" fill="#18312F">AD 31 · Resurrection</text><text x="334" y="670" font-size="18" font-weight="400" fill="#993F38">Cleanses before proceeding inward.</text><text x="752" y="670" font-size="18" font-weight="400" fill="#226749">Resurrection; source describes removal of</text><text x="752" y="696" font-size="18" font-weight="400" fill="#226749">“traces of sin.”</text><text x="1170" y="670" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="758" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="776" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="796" font-size="17" font-weight="700" fill="#FFFFFF">04</text><text x="68" y="829" font-size="18" font-weight="700" fill="#18312F">AD 31 · Following</text><text x="68" y="854" font-size="18" font-weight="700" fill="#18312F">resurrection</text><text x="334" y="790" font-size="18" font-weight="400" fill="#993F38">Collects incense and censer to carry</text><text x="334" y="816" font-size="18" font-weight="400" fill="#993F38">inward.</text><text x="752" y="790" font-size="18" font-weight="400" fill="#226749">Passes through with His own merits.</text><text x="1170" y="790" font-size="17" font-weight="400" fill="#18312F">Altar of incense;</text><text x="1170" y="816" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="891" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="909" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="929" font-size="17" font-weight="700" fill="#FFFFFF">05</text><text x="68" y="962" font-size="18" font-weight="700" fill="#18312F">AD 31 · Following</text><text x="68" y="987" font-size="18" font-weight="700" fill="#18312F">resurrection</text><text x="334" y="923" font-size="18" font-weight="400" fill="#993F38">Places bull’s blood on the ark/mercy seat</text><text x="334" y="949" font-size="18" font-weight="400" fill="#993F38">and brings incense before God.</text><text x="752" y="923" font-size="18" font-weight="400" fill="#226749">Presents His blood; acceptance by God.</text><text x="1170" y="923" font-size="17" font-weight="400" fill="#18312F">Ark; mercy seat;</text><text x="1170" y="949" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="1024" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="1042" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1062" font-size="17" font-weight="700" fill="#FFFFFF">06</text><text x="68" y="1095" font-size="18" font-weight="700" fill="#18312F">AD 31 · Forty-day</text><text x="68" y="1120" font-size="18" font-weight="700" fill="#18312F">period</text><text x="334" y="1056" font-size="18" font-weight="400" fill="#993F38">Meets his sons; prepares the people’s</text><text x="334" y="1082" font-size="18" font-weight="400" fill="#993F38">lamb offering.</text><text x="752" y="1056" font-size="18" font-weight="400" fill="#226749">Returns to His co-laborers; forty days on</text><text x="752" y="1082" font-size="18" font-weight="400" fill="#226749">earth; represented as the Lamb for the</text><text x="752" y="1108" font-size="18" font-weight="400" fill="#226749">people.</text><text x="1170" y="1056" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="1157" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="1175" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1195" font-size="17" font-weight="700" fill="#FFFFFF">07</text><text x="68" y="1228" font-size="18" font-weight="700" fill="#18312F">AD 31 · Before</text><text x="68" y="1253" font-size="18" font-weight="700" fill="#18312F">inauguration</text><text x="334" y="1189" font-size="18" font-weight="400" fill="#993F38">Washes hands and feet before</text><text x="334" y="1215" font-size="18" font-weight="400" fill="#993F38">high-priestly service.</text><text x="752" y="1189" font-size="18" font-weight="400" fill="#226749">Divine stature restored to sixteen feet,</text><text x="752" y="1215" font-size="18" font-weight="400" fill="#226749">according to the source.</text><text x="1170" y="1189" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="1290" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1308" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1328" font-size="17" font-weight="700" fill="#FFFFFF">08</text><text x="68" y="1361" font-size="18" font-weight="700" fill="#18312F">AD 31 · Inauguration</text><text x="334" y="1322" font-size="18" font-weight="400" fill="#993F38">Dresses for high-priestly service.</text><text x="752" y="1322" font-size="18" font-weight="400" fill="#226749">Inauguration as High Priest.</text><text x="1170" y="1322" font-size="17" font-weight="400" fill="#18312F">Holy Place; priestly</text><text x="1170" y="1348" font-size="17" font-weight="400" fill="#18312F">garments</text><rect x="48" y="1410" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1428" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1448" font-size="17" font-weight="700" fill="#FFFFFF">09</text><text x="68" y="1481" font-size="18" font-weight="700" fill="#18312F">AD 31 · Pentecost</text><text x="334" y="1442" font-size="18" font-weight="400" fill="#993F38">Supplies the lamp with oil.</text><text x="752" y="1442" font-size="18" font-weight="400" fill="#226749">Pentecost; pours out the Holy Spirit.</text><text x="1170" y="1442" font-size="17" font-weight="400" fill="#18312F">Golden lampstand</text><rect x="48" y="1530" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="1548" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1568" font-size="17" font-weight="700" fill="#FFFFFF">10</text><text x="68" y="1601" font-size="18" font-weight="700" fill="#18312F">Continuing daily</text><text x="68" y="1626" font-size="18" font-weight="700" fill="#18312F">service</text><text x="334" y="1562" font-size="18" font-weight="400" fill="#993F38">Offers incense during the continuing daily</text><text x="334" y="1588" font-size="18" font-weight="400" fill="#993F38">service.</text><text x="752" y="1562" font-size="18" font-weight="400" fill="#226749">At the first throne, pleading His merits for</text><text x="752" y="1588" font-size="18" font-weight="400" fill="#226749">the people.</text><text x="1170" y="1562" font-size="17" font-weight="400" fill="#18312F">Altar of incense</text><text x="60" y="1691" font-size="17" font-weight="400" fill="#576763">Aaron’s “about 6 a.m.” and “most part of the day” describe the symbolic service-day clock, not historical calendar dates.</text><text x="60" y="1716" font-size="17" font-weight="400" fill="#576763">Source-based study correspondence • The numbering and theological interpretation follow the supplied timelines.</text></g></svg>