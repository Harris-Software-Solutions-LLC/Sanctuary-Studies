<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1398" viewBox="0 0 1440 1398" role="img" aria-labelledby="title desc"><title id="title">Holy Place</title><desc id="desc">Incense, illumination and priestly transitions. Steps 11–12 follow the diagram’s Holy Place approach grouping; their actions concern the entrance/court. Neither uses the lampstand. Step 19 is a garment transition.</desc><rect width="100%" height="100%" fill="#F5F4EF"/><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="240" rx="0" fill="#F5F4EF"/><rect x="40" y="42" width="5" height="42" rx="0" fill="#A1823D"/><text x="62" y="60" font-size="15" font-weight="700" fill="#576763">SANCTUARY STUDIES / THE SANCTUARY WORK</text><text x="60" y="116" font-size="38" font-weight="700" fill="#18312F">Holy Place</text><text x="60" y="153" font-size="20" font-weight="400" fill="#576763">Incense, illumination and priestly transitions</text><text x="60" y="194" font-size="15" font-weight="700" fill="#993F38">AARON · EARTHLY SERVICE</text><text x="400" y="194" font-size="15" font-weight="700" fill="#226749">CHRIST · CORRESPONDING WORK</text><text x="1040" y="194" font-size="13" font-weight="400" fill="#576763">SOURCE NUMBERING PRESERVED</text><rect x="48" y="218" width="1344" height="48" rx="8" fill="#18312F"/><text x="68" y="248" font-size="13" font-weight="700" fill="#FFFFFF">STEP / ACTION</text><text x="334" y="248" font-size="13" font-weight="700" fill="#FFFFFF">AARON · FUNCTION</text><text x="752" y="248" font-size="13" font-weight="700" fill="#FFFFFF">CHRIST · CORRESPONDENCE</text><text x="1170" y="248" font-size="13" font-weight="700" fill="#FFFFFF">FURNITURE / FEATURE</text><rect x="48" y="278" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="296" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="316" font-size="17" font-weight="700" fill="#FFFFFF">04</text><text x="68" y="349" font-size="18" font-weight="700" fill="#18312F">Take incense and</text><text x="68" y="374" font-size="18" font-weight="700" fill="#18312F">censer</text><text x="334" y="310" font-size="18" font-weight="400" fill="#993F38">Collects incense and censer to carry</text><text x="334" y="336" font-size="18" font-weight="400" fill="#993F38">inward.</text><text x="752" y="310" font-size="18" font-weight="400" fill="#226749">Passes through with His own merits.</text><text x="1170" y="310" font-size="17" font-weight="400" fill="#18312F">Altar of incense;</text><text x="1170" y="336" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="411" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="429" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="449" font-size="17" font-weight="700" fill="#FFFFFF">08</text><text x="68" y="482" font-size="18" font-weight="700" fill="#18312F">Dress as High Priest</text><text x="334" y="443" font-size="18" font-weight="400" fill="#993F38">Dresses for high-priestly service.</text><text x="752" y="443" font-size="18" font-weight="400" fill="#226749">Inauguration as High Priest.</text><text x="1170" y="443" font-size="17" font-weight="400" fill="#18312F">Holy Place; priestly</text><text x="1170" y="469" font-size="17" font-weight="400" fill="#18312F">garments</text><rect x="48" y="531" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="549" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="569" font-size="17" font-weight="700" fill="#FFFFFF">09</text><text x="68" y="602" font-size="18" font-weight="700" fill="#18312F">Pour oil into the lamp</text><text x="334" y="563" font-size="18" font-weight="400" fill="#993F38">Supplies the lamp with oil.</text><text x="752" y="563" font-size="18" font-weight="400" fill="#226749">Pentecost; pours out the Holy Spirit.</text><text x="1170" y="563" font-size="17" font-weight="400" fill="#18312F">Golden lampstand</text><rect x="48" y="651" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="669" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="689" font-size="17" font-weight="700" fill="#FFFFFF">10</text><text x="68" y="722" font-size="18" font-weight="700" fill="#18312F">Offer incense</text><text x="334" y="683" font-size="18" font-weight="400" fill="#993F38">Offers incense during the continuing daily</text><text x="334" y="709" font-size="18" font-weight="400" fill="#993F38">service.</text><text x="752" y="683" font-size="18" font-weight="400" fill="#226749">At the first throne, pleading His merits for</text><text x="752" y="709" font-size="18" font-weight="400" fill="#226749">the people.</text><text x="1170" y="683" font-size="17" font-weight="400" fill="#18312F">Altar of incense</text><rect x="48" y="771" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="789" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="809" font-size="17" font-weight="700" fill="#FFFFFF">11</text><text x="68" y="842" font-size="18" font-weight="700" fill="#18312F">Blow the trumpet</text><text x="334" y="803" font-size="18" font-weight="400" fill="#993F38">Gives the first warning of the Day of</text><text x="334" y="829" font-size="18" font-weight="400" fill="#993F38">Atonement.</text><text x="752" y="803" font-size="18" font-weight="400" fill="#226749">First angel’s message preached.</text><text x="1170" y="803" font-size="17" font-weight="400" fill="#18312F">Silver trumpet · not</text><text x="1170" y="829" font-size="17" font-weight="400" fill="#18312F">furniture</text><rect x="48" y="891" width="1344" height="118" rx="8" fill="#EDF1EB"/><rect x="68" y="909" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="929" font-size="17" font-weight="700" fill="#FFFFFF">12</text><text x="68" y="962" font-size="18" font-weight="700" fill="#18312F">Cast lots; Lord’s goat</text><text x="334" y="923" font-size="18" font-weight="400" fill="#993F38">Begins the congregation’s offering;</text><text x="334" y="949" font-size="18" font-weight="400" fill="#993F38">common priests leave the court.</text><text x="752" y="923" font-size="18" font-weight="400" fill="#226749">Twenty-four elders’ work ends; Jesus</text><text x="752" y="949" font-size="18" font-weight="400" fill="#226749">represented as the goat for the people,</text><text x="752" y="975" font-size="18" font-weight="400" fill="#226749">according to the source.</text><text x="1170" y="923" font-size="17" font-weight="400" fill="#18312F">Two goats; lots;</text><text x="1170" y="949" font-size="17" font-weight="400" fill="#18312F">entrance/court</text><rect x="48" y="1017" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="1035" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1055" font-size="17" font-weight="700" fill="#FFFFFF">17</text><text x="68" y="1088" font-size="18" font-weight="700" fill="#18312F">Cleanse the incense</text><text x="68" y="1113" font-size="18" font-weight="700" fill="#18312F">altar</text><text x="334" y="1049" font-size="18" font-weight="400" fill="#993F38">Stops at the altar and cleanses it by blood.</text><text x="752" y="1049" font-size="18" font-weight="400" fill="#226749">Throws down censer; cleanses Holy Place;</text><text x="752" y="1075" font-size="18" font-weight="400" fill="#226749">close of probation.</text><text x="1170" y="1049" font-size="17" font-weight="400" fill="#18312F">Altar of incense;</text><text x="1170" y="1075" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="1150" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="1168" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1188" font-size="17" font-weight="700" fill="#FFFFFF">19</text><text x="68" y="1221" font-size="18" font-weight="700" fill="#18312F">Remove high-priestly</text><text x="68" y="1246" font-size="18" font-weight="700" fill="#18312F">robes</text><text x="334" y="1182" font-size="18" font-weight="400" fill="#993F38">Changes out of the high-priestly garments.</text><text x="752" y="1182" font-size="18" font-weight="400" fill="#226749">Removes high-priestly robes.</text><text x="1170" y="1182" font-size="17" font-weight="400" fill="#18312F">Garments; sanctuary</text><text x="1170" y="1208" font-size="17" font-weight="400" fill="#18312F">transition</text><text x="60" y="1311" font-size="17" font-weight="400" fill="#576763">Steps 11–12 follow the diagram’s Holy Place approach grouping; their actions concern the entrance/court. Neither uses the lampstand. Step 19 is a</text><text x="60" y="1336" font-size="17" font-weight="400" fill="#576763">garment transition.</text><text x="60" y="1361" font-size="17" font-weight="400" fill="#576763">Table of showbread: present in the sanctuary, but no numbered action is specified in these diagrams.</text></g></svg>