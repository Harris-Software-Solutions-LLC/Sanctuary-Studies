<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840" role="img" aria-labelledby="title desc"><title id="title">Outer court</title><desc id="desc">Service at the gate, laver, altar and courtyard boundary. Step 18 is an entrance/courtyard boundary action. Step 24 occurs outside the camp and is grouped here for continuity.</desc><rect width="100%" height="100%" fill="#F5F4EF"/><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="240" rx="0" fill="#F5F4EF"/><rect x="40" y="42" width="5" height="42" rx="0" fill="#A1823D"/><text x="62" y="60" font-size="15" font-weight="700" fill="#576763">SANCTUARY STUDIES / THE SANCTUARY WORK</text><text x="60" y="116" font-size="38" font-weight="700" fill="#18312F">Outer court</text><text x="60" y="153" font-size="20" font-weight="400" fill="#576763">Service at the gate, laver, altar and courtyard boundary</text><text x="60" y="194" font-size="15" font-weight="700" fill="#993F38">AARON · EARTHLY SERVICE</text><text x="400" y="194" font-size="15" font-weight="700" fill="#226749">CHRIST · CORRESPONDING WORK</text><text x="1040" y="194" font-size="13" font-weight="400" fill="#576763">SOURCE NUMBERING PRESERVED</text><rect x="48" y="218" width="1344" height="48" rx="8" fill="#18312F"/><text x="68" y="248" font-size="13" font-weight="700" fill="#FFFFFF">STEP / ACTION</text><text x="334" y="248" font-size="13" font-weight="700" fill="#FFFFFF">AARON · FUNCTION</text><text x="752" y="248" font-size="13" font-weight="700" fill="#FFFFFF">CHRIST · CORRESPONDENCE</text><text x="1170" y="248" font-size="13" font-weight="700" fill="#FFFFFF">FURNITURE / FEATURE</text><rect x="48" y="278" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="296" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="316" font-size="17" font-weight="700" fill="#FFFFFF">00</text><text x="68" y="349" font-size="18" font-weight="700" fill="#18312F">Enter the gate</text><text x="334" y="310" font-size="18" font-weight="400" fill="#993F38">Comes into the courtyard to begin</text><text x="334" y="336" font-size="18" font-weight="400" fill="#993F38">ministry.</text><text x="752" y="310" font-size="18" font-weight="400" fill="#226749">Jesus is born.</text><text x="1170" y="310" font-size="17" font-weight="400" fill="#18312F">Courtyard gate</text><rect x="48" y="398" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="416" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="436" font-size="17" font-weight="700" fill="#FFFFFF">01</text><text x="68" y="469" font-size="18" font-weight="700" fill="#18312F">Wash and dress</text><text x="334" y="430" font-size="18" font-weight="400" fill="#993F38">Washes body; puts on common priest’s</text><text x="334" y="456" font-size="18" font-weight="400" fill="#993F38">garments to prepare for service.</text><text x="752" y="430" font-size="18" font-weight="400" fill="#226749">Baptism.</text><text x="1170" y="430" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="518" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="536" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="556" font-size="17" font-weight="700" fill="#FFFFFF">02</text><text x="68" y="589" font-size="18" font-weight="700" fill="#18312F">Offer the bull</text><text x="334" y="550" font-size="18" font-weight="400" fill="#993F38">Offers a bull for himself and his household</text><text x="334" y="576" font-size="18" font-weight="400" fill="#993F38">before serving the people.</text><text x="752" y="550" font-size="18" font-weight="400" fill="#226749">Crucifixion; represented as the bull</text><text x="752" y="576" font-size="18" font-weight="400" fill="#226749">offering for Himself and His co-laborers.</text><text x="1170" y="550" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="638" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="656" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="676" font-size="17" font-weight="700" fill="#FFFFFF">03</text><text x="68" y="709" font-size="18" font-weight="700" fill="#18312F">Wash hands and feet</text><text x="334" y="670" font-size="18" font-weight="400" fill="#993F38">Cleanses before proceeding inward.</text><text x="752" y="670" font-size="18" font-weight="400" fill="#226749">Resurrection; source describes removal of</text><text x="752" y="696" font-size="18" font-weight="400" fill="#226749">“traces of sin.”</text><text x="1170" y="670" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="758" width="1344" height="118" rx="8" fill="#FFFFFF"/><rect x="68" y="776" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="796" font-size="17" font-weight="700" fill="#FFFFFF">06</text><text x="68" y="829" font-size="18" font-weight="700" fill="#18312F">Return to co-laborers</text><text x="334" y="790" font-size="18" font-weight="400" fill="#993F38">Meets his sons; prepares the people’s</text><text x="334" y="816" font-size="18" font-weight="400" fill="#993F38">lamb offering.</text><text x="752" y="790" font-size="18" font-weight="400" fill="#226749">Returns to His co-laborers; forty days on</text><text x="752" y="816" font-size="18" font-weight="400" fill="#226749">earth; represented as the Lamb for the</text><text x="752" y="842" font-size="18" font-weight="400" fill="#226749">people.</text><text x="1170" y="790" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="884" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="902" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="922" font-size="17" font-weight="700" fill="#FFFFFF">07</text><text x="68" y="955" font-size="18" font-weight="700" fill="#18312F">Wash again</text><text x="334" y="916" font-size="18" font-weight="400" fill="#993F38">Washes hands and feet before</text><text x="334" y="942" font-size="18" font-weight="400" fill="#993F38">high-priestly service.</text><text x="752" y="916" font-size="18" font-weight="400" fill="#226749">Divine stature restored to sixteen feet,</text><text x="752" y="942" font-size="18" font-weight="400" fill="#226749">according to the source.</text><text x="1170" y="916" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="1004" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="1022" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1042" font-size="17" font-weight="700" fill="#FFFFFF">18</text><text x="68" y="1075" font-size="18" font-weight="700" fill="#18312F">Place sins on</text><text x="68" y="1100" font-size="18" font-weight="700" fill="#18312F">scapegoat</text><text x="334" y="1036" font-size="18" font-weight="400" fill="#993F38">Transfers sins removed from the sanctuary</text><text x="334" y="1062" font-size="18" font-weight="400" fill="#993F38">to the live goat.</text><text x="752" y="1036" font-size="18" font-weight="400" fill="#226749">Places sins upon Satan.</text><text x="1170" y="1036" font-size="17" font-weight="400" fill="#18312F">Live scapegoat;</text><text x="1170" y="1062" font-size="17" font-weight="400" fill="#18312F">sanctuary entrance</text><rect x="48" y="1137" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1155" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1175" font-size="17" font-weight="700" fill="#FFFFFF">20</text><text x="68" y="1208" font-size="18" font-weight="700" fill="#18312F">Leave the sanctuary</text><text x="334" y="1169" font-size="18" font-weight="400" fill="#993F38">Comes out in white garments after</text><text x="334" y="1195" font-size="18" font-weight="400" fill="#993F38">completing the inward service.</text><text x="752" y="1169" font-size="18" font-weight="400" fill="#226749">Leaves sanctuary; associated with the</text><text x="752" y="1195" font-size="18" font-weight="400" fill="#226749">plagues in the source.</text><text x="1170" y="1169" font-size="17" font-weight="400" fill="#18312F">Door; exit route</text><rect x="48" y="1257" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1275" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1295" font-size="17" font-weight="700" fill="#FFFFFF">21</text><text x="68" y="1328" font-size="18" font-weight="700" fill="#18312F">Wash body again</text><text x="334" y="1289" font-size="18" font-weight="400" fill="#993F38">Washes at the laver following the</text><text x="334" y="1315" font-size="18" font-weight="400" fill="#993F38">sanctuary service.</text><text x="752" y="1289" font-size="18" font-weight="400" fill="#226749">Jacob’s time of trouble; plagues; “cup of</text><text x="752" y="1315" font-size="18" font-weight="400" fill="#226749">baptism.”</text><text x="1170" y="1289" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="1377" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1395" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1415" font-size="17" font-weight="700" fill="#FFFFFF">22</text><text x="68" y="1448" font-size="18" font-weight="700" fill="#18312F">Offer two rams</text><text x="334" y="1409" font-size="18" font-weight="400" fill="#993F38">Places the burnt offerings on the fire.</text><text x="752" y="1409" font-size="18" font-weight="400" fill="#226749">Second Coming of Christ.</text><text x="1170" y="1409" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="1497" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1515" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1535" font-size="17" font-weight="700" fill="#FFFFFF">23</text><text x="68" y="1568" font-size="18" font-weight="700" fill="#18312F">Burn the fat</text><text x="334" y="1529" font-size="18" font-weight="400" fill="#993F38">Places the fat on the fire.</text><text x="752" y="1529" font-size="18" font-weight="400" fill="#226749">End of sinners.</text><text x="1170" y="1529" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="1617" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="1635" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1655" font-size="17" font-weight="700" fill="#FFFFFF">24</text><text x="68" y="1688" font-size="18" font-weight="700" fill="#18312F">Burn bodies outside</text><text x="68" y="1713" font-size="18" font-weight="700" fill="#18312F">camp</text><text x="334" y="1649" font-size="18" font-weight="400" fill="#993F38">Disposes of the bull’s and goat’s bodies</text><text x="334" y="1675" font-size="18" font-weight="400" fill="#993F38">outside the camp.</text><text x="752" y="1649" font-size="18" font-weight="400" fill="#226749">Second fire; New Earth; all trace of sin</text><text x="752" y="1675" font-size="18" font-weight="400" fill="#226749">gone.</text><text x="1170" y="1649" font-size="17" font-weight="400" fill="#18312F">Outside camp · not</text><text x="1170" y="1675" font-size="17" font-weight="400" fill="#18312F">furniture</text><text x="60" y="1778" font-size="17" font-weight="400" fill="#576763">Step 18 is an entrance/courtyard boundary action. Step 24 occurs outside the camp and is grouped here for continuity.</text><text x="60" y="1803" font-size="17" font-weight="400" fill="#576763">Source-based study correspondence • The numbering and theological interpretation follow the supplied timelines.</text></g></svg>