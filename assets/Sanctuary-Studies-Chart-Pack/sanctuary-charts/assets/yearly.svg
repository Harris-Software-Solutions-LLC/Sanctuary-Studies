<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2125" viewBox="0 0 1440 2125" role="img" aria-labelledby="title desc"><title id="title">Yearly timeline</title><desc id="desc">Steps 11–24 · Warning, judgment and completion. AM = anno mundi, year of the world—not a.m. clock time. 6,000/7,000 AM are the source’s schematic framework, not Gregorian predictions. The interval between Steps 23–24 is unspecified.</desc><rect width="100%" height="100%" fill="#F5F4EF"/><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1440" height="240" rx="0" fill="#F5F4EF"/><rect x="40" y="42" width="5" height="42" rx="0" fill="#A1823D"/><text x="62" y="60" font-size="15" font-weight="700" fill="#576763">SANCTUARY STUDIES / THE SANCTUARY WORK</text><text x="60" y="116" font-size="38" font-weight="700" fill="#18312F">Yearly timeline</text><text x="60" y="153" font-size="20" font-weight="400" fill="#576763">Steps 11–24 · Warning, judgment and completion</text><text x="60" y="194" font-size="15" font-weight="700" fill="#993F38">AARON · EARTHLY SERVICE</text><text x="400" y="194" font-size="15" font-weight="700" fill="#226749">CHRIST · CORRESPONDING WORK</text><text x="1040" y="194" font-size="13" font-weight="400" fill="#576763">SOURCE NUMBERING PRESERVED</text><rect x="48" y="218" width="1344" height="48" rx="8" fill="#18312F"/><text x="68" y="248" font-size="13" font-weight="700" fill="#FFFFFF">STEP / DATE OR PERIOD</text><text x="334" y="248" font-size="13" font-weight="700" fill="#FFFFFF">AARON · FUNCTION</text><text x="752" y="248" font-size="13" font-weight="700" fill="#FFFFFF">CHRIST · CORRESPONDENCE</text><text x="1170" y="248" font-size="13" font-weight="700" fill="#FFFFFF">FURNITURE / FEATURE</text><rect x="48" y="278" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="296" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="316" font-size="17" font-weight="700" fill="#FFFFFF">11</text><text x="68" y="349" font-size="18" font-weight="700" fill="#18312F">1833</text><text x="334" y="310" font-size="18" font-weight="400" fill="#993F38">Gives the first warning of the Day of</text><text x="334" y="336" font-size="18" font-weight="400" fill="#993F38">Atonement.</text><text x="752" y="310" font-size="18" font-weight="400" fill="#226749">First angel’s message preached.</text><text x="1170" y="310" font-size="17" font-weight="400" fill="#18312F">Silver trumpet · not</text><text x="1170" y="336" font-size="17" font-weight="400" fill="#18312F">furniture</text><rect x="48" y="398" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="416" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="436" font-size="17" font-weight="700" fill="#FFFFFF">12</text><text x="68" y="469" font-size="18" font-weight="700" fill="#18312F">Approach to Day of</text><text x="68" y="494" font-size="18" font-weight="700" fill="#18312F">Atonement</text><text x="334" y="430" font-size="18" font-weight="400" fill="#993F38">Begins the congregation’s offering;</text><text x="334" y="456" font-size="18" font-weight="400" fill="#993F38">common priests leave the court.</text><text x="752" y="430" font-size="18" font-weight="400" fill="#226749">Twenty-four elders’ work ends; Jesus</text><text x="752" y="456" font-size="18" font-weight="400" fill="#226749">represented as the goat for the people,</text><text x="752" y="482" font-size="18" font-weight="400" fill="#226749">according to the source.</text><text x="1170" y="430" font-size="17" font-weight="400" fill="#18312F">Two goats; lots;</text><text x="1170" y="456" font-size="17" font-weight="400" fill="#18312F">entrance/court</text><rect x="48" y="531" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="549" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="569" font-size="17" font-weight="700" fill="#FFFFFF">13</text><text x="68" y="602" font-size="18" font-weight="700" fill="#18312F">October 22, 1844</text><text x="334" y="563" font-size="18" font-weight="400" fill="#993F38">Carries the congregation’s offering within</text><text x="334" y="589" font-size="18" font-weight="400" fill="#993F38">the veil.</text><text x="752" y="563" font-size="18" font-weight="400" fill="#226749">Enters the Most Holy Place in heaven.</text><text x="1170" y="563" font-size="17" font-weight="400" fill="#18312F">Inner veil; ark; mercy</text><text x="1170" y="589" font-size="17" font-weight="400" fill="#18312F">seat</text><rect x="48" y="651" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="669" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="689" font-size="17" font-weight="700" fill="#FFFFFF">14</text><text x="68" y="722" font-size="18" font-weight="700" fill="#18312F">1844</text><text x="334" y="683" font-size="18" font-weight="400" fill="#993F38">No Aaron counterpart is shown.</text><text x="752" y="683" font-size="18" font-weight="400" fill="#226749">Stands before the law, showing the</text><text x="752" y="709" font-size="18" font-weight="400" fill="#226749">Sabbath to believers in 1844.</text><text x="1170" y="683" font-size="17" font-weight="400" fill="#18312F">Ark; tablets of the law</text><rect x="48" y="771" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="789" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="809" font-size="17" font-weight="700" fill="#FFFFFF">15</text><text x="68" y="842" font-size="18" font-weight="700" fill="#18312F">1844 onward</text><text x="334" y="803" font-size="18" font-weight="400" fill="#993F38">Participates in the yearly service before</text><text x="334" y="829" font-size="18" font-weight="400" fill="#993F38">God.</text><text x="752" y="803" font-size="18" font-weight="400" fill="#226749">Sits with God as Judge; investigative</text><text x="752" y="829" font-size="18" font-weight="400" fill="#226749">judgment.</text><text x="1170" y="803" font-size="17" font-weight="400" fill="#18312F">Ark/mercy-seat setting;</text><text x="1170" y="829" font-size="17" font-weight="400" fill="#18312F">throne</text><rect x="48" y="891" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="909" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="929" font-size="17" font-weight="700" fill="#FFFFFF">16</text><text x="68" y="962" font-size="18" font-weight="700" fill="#18312F">Completion of</text><text x="68" y="987" font-size="18" font-weight="700" fill="#18312F">judgment</text><text x="334" y="923" font-size="18" font-weight="400" fill="#993F38">Sprinkles blood on the mercy seat and</text><text x="334" y="949" font-size="18" font-weight="400" fill="#993F38">before the law.</text><text x="752" y="923" font-size="18" font-weight="400" fill="#226749">Pleads His blood; sins removed, people</text><text x="752" y="949" font-size="18" font-weight="400" fill="#226749">sealed, sins blotted from the book.</text><text x="1170" y="923" font-size="17" font-weight="400" fill="#18312F">Mercy seat; law; record</text><text x="1170" y="949" font-size="17" font-weight="400" fill="#18312F">books</text><rect x="48" y="1024" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1042" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1062" font-size="17" font-weight="700" fill="#FFFFFF">17</text><text x="68" y="1095" font-size="18" font-weight="700" fill="#18312F">Near 6,000 AM</text><text x="334" y="1056" font-size="18" font-weight="400" fill="#993F38">Stops at the altar and cleanses it by blood.</text><text x="752" y="1056" font-size="18" font-weight="400" fill="#226749">Throws down censer; cleanses Holy Place;</text><text x="752" y="1082" font-size="18" font-weight="400" fill="#226749">close of probation.</text><text x="1170" y="1056" font-size="17" font-weight="400" fill="#18312F">Altar of incense;</text><text x="1170" y="1082" font-size="17" font-weight="400" fill="#18312F">censer</text><rect x="48" y="1144" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1162" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1182" font-size="17" font-weight="700" fill="#FFFFFF">18</text><text x="68" y="1215" font-size="18" font-weight="700" fill="#18312F">Following Step 17</text><text x="334" y="1176" font-size="18" font-weight="400" fill="#993F38">Transfers sins removed from the sanctuary</text><text x="334" y="1202" font-size="18" font-weight="400" fill="#993F38">to the live goat.</text><text x="752" y="1176" font-size="18" font-weight="400" fill="#226749">Places sins upon Satan.</text><text x="1170" y="1176" font-size="17" font-weight="400" fill="#18312F">Live scapegoat;</text><text x="1170" y="1202" font-size="17" font-weight="400" fill="#18312F">sanctuary entrance</text><rect x="48" y="1264" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1282" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1302" font-size="17" font-weight="700" fill="#FFFFFF">19</text><text x="68" y="1335" font-size="18" font-weight="700" fill="#18312F">Following Step 18</text><text x="334" y="1296" font-size="18" font-weight="400" fill="#993F38">Changes out of the high-priestly garments.</text><text x="752" y="1296" font-size="18" font-weight="400" fill="#226749">Removes high-priestly robes.</text><text x="1170" y="1296" font-size="17" font-weight="400" fill="#18312F">Garments; sanctuary</text><text x="1170" y="1322" font-size="17" font-weight="400" fill="#18312F">transition</text><rect x="48" y="1384" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1402" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1422" font-size="17" font-weight="700" fill="#FFFFFF">20</text><text x="68" y="1455" font-size="18" font-weight="700" fill="#18312F">Following Step 19</text><text x="334" y="1416" font-size="18" font-weight="400" fill="#993F38">Comes out in white garments after</text><text x="334" y="1442" font-size="18" font-weight="400" fill="#993F38">completing the inward service.</text><text x="752" y="1416" font-size="18" font-weight="400" fill="#226749">Leaves sanctuary; associated with the</text><text x="752" y="1442" font-size="18" font-weight="400" fill="#226749">plagues in the source.</text><text x="1170" y="1416" font-size="17" font-weight="400" fill="#18312F">Door; exit route</text><rect x="48" y="1504" width="1344" height="125" rx="8" fill="#FFFFFF"/><rect x="68" y="1522" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1542" font-size="17" font-weight="700" fill="#FFFFFF">21</text><text x="68" y="1575" font-size="18" font-weight="700" fill="#18312F">6,000 AM era · After</text><text x="68" y="1600" font-size="18" font-weight="700" fill="#18312F">sanctuary exit</text><text x="334" y="1536" font-size="18" font-weight="400" fill="#993F38">Washes at the laver following the</text><text x="334" y="1562" font-size="18" font-weight="400" fill="#993F38">sanctuary service.</text><text x="752" y="1536" font-size="18" font-weight="400" fill="#226749">Jacob’s time of trouble; plagues; “cup of</text><text x="752" y="1562" font-size="18" font-weight="400" fill="#226749">baptism.”</text><text x="1170" y="1536" font-size="17" font-weight="400" fill="#18312F">Laver</text><rect x="48" y="1637" width="1344" height="125" rx="8" fill="#EDF1EB"/><rect x="68" y="1655" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1675" font-size="17" font-weight="700" fill="#FFFFFF">22</text><text x="68" y="1708" font-size="18" font-weight="700" fill="#18312F">Following time of</text><text x="68" y="1733" font-size="18" font-weight="700" fill="#18312F">trouble</text><text x="334" y="1669" font-size="18" font-weight="400" fill="#993F38">Places the burnt offerings on the fire.</text><text x="752" y="1669" font-size="18" font-weight="400" fill="#226749">Second Coming of Christ.</text><text x="1170" y="1669" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="1770" width="1344" height="112" rx="8" fill="#FFFFFF"/><rect x="68" y="1788" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1808" font-size="17" font-weight="700" fill="#FFFFFF">23</text><text x="68" y="1841" font-size="18" font-weight="700" fill="#18312F">Following Step 22</text><text x="334" y="1802" font-size="18" font-weight="400" fill="#993F38">Places the fat on the fire.</text><text x="752" y="1802" font-size="18" font-weight="400" fill="#226749">End of sinners.</text><text x="1170" y="1802" font-size="17" font-weight="400" fill="#18312F">Altar of sacrifice</text><rect x="48" y="1890" width="1344" height="112" rx="8" fill="#EDF1EB"/><rect x="68" y="1908" width="66" height="27" rx="5" fill="#18312F"/><text x="79" y="1928" font-size="17" font-weight="700" fill="#FFFFFF">24</text><text x="68" y="1961" font-size="18" font-weight="700" fill="#18312F">7,000 AM</text><text x="334" y="1922" font-size="18" font-weight="400" fill="#993F38">Disposes of the bull’s and goat’s bodies</text><text x="334" y="1948" font-size="18" font-weight="400" fill="#993F38">outside the camp.</text><text x="752" y="1922" font-size="18" font-weight="400" fill="#226749">Second fire; New Earth; all trace of sin</text><text x="752" y="1948" font-size="18" font-weight="400" fill="#226749">gone.</text><text x="1170" y="1922" font-size="17" font-weight="400" fill="#18312F">Outside camp · not</text><text x="1170" y="1948" font-size="17" font-weight="400" fill="#18312F">furniture</text><text x="60" y="2038" font-size="17" font-weight="400" fill="#576763">AM = anno mundi, year of the world—not a.m. clock time. 6,000/7,000 AM are the source’s schematic framework, not Gregorian predictions. The</text><text x="60" y="2063" font-size="17" font-weight="400" fill="#576763">interval between Steps 23–24 is unspecified.</text><text x="60" y="2088" font-size="17" font-weight="400" fill="#576763">Source-based study correspondence • The numbering and theological interpretation follow the supplied timelines.</text></g></svg>